description: Lean Aquila design-production mode for verified Open Design HTML,
  reference search, screenshots, revisions, and artifact lifecycle control.
instruction: Use AEDILIS for UX briefs and visual acceptance, PICTOR for create or
  revise implementation, EXPLORATOR for source verification, and open-design-producer
  as the shared execution capability. Search references before production when they
